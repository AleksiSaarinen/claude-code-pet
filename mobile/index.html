<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Claude Code Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: 'Segoe UI', 'SF Pro', system-ui, sans-serif;
    overflow: hidden;
    color: #e0e0e0;
  }

  /* ── Collapsed mode ── */
  .container {
    width: 150px;
    height: 165px;
    position: relative;
    transition: width 0.3s ease, height 0.3s ease;
    background: rgba(26, 26, 46, 0.92);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-user-select: none;
    user-select: none;
  }
  .container.expanded {
    width: 320px;
    height: 500px;
    border-radius: 16px;
  }

  /* ── Top bar (expanded only) ── */
  .top-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px 0;
    flex-shrink: 0;
  }
  .container.expanded .top-bar { display: flex; }

  /* ── Keyboard mode: shrink container so input clears the keyboard ── */
  .container.keyboard-mode { height: 440px; }
  .top-bar .right-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .top-bar .close-btn, .top-bar .new-chat-btn {
    background: none;
    border: none;
    color: #8b949e;
    font-size: 20px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }
  .top-bar .close-btn:active { color: #e94560; }
  .top-bar .new-chat-btn { font-size: 15px; }
  .top-bar .new-chat-btn:active { color: #58a6ff; }

  /* ── Pet area ── */
  .pet-area {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 30px;
  }
  .container.expanded .pet-area {
    padding-top: 4px;
    flex-shrink: 0;
  }

  #petCanvas {
    width: 120px;
    height: 120px;
    image-rendering: pixelated;
    cursor: pointer;
  }
  .container.expanded #petCanvas {
    width: 80px;
    height: 80px;
  }

  /* ── Speech bubble — expanded: left of character ── */
  .container.expanded .speech-bubble {
    top: 50%;
    left: auto;
    right: calc(50% + 48px);
    transform: translateY(-50%);
    transform-origin: center right;
    max-width: 120px;
    font-size: 9px;
  }
  .container.expanded .speech-bubble::after {
    /* Arrow points right toward character */
    top: 50%;
    bottom: auto;
    left: auto;
    right: -6px;
    transform: translateY(-50%);
    border-left: 6px solid rgba(255, 255, 255, 0.93);
    border-right: none;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
  }
  .container.expanded .speech-bubble.visible {
    transform: translateY(-50%) scale(1);
  }
  @keyframes speech-pop-side {
    0% { transform: translateY(-50%) scale(0.7); opacity: 0; }
    60% { transform: translateY(-50%) scale(1.05); }
    100% { transform: translateY(-50%) scale(1); opacity: 1; }
  }
  .container.expanded .speech-bubble.visible {
    animation: speech-pop-side 0.25s ease-out;
  }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(26, 26, 46, 0.98);
    z-index: 150;
    border-radius: 20px;
    transition: opacity 0.4s ease;
  }
  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(233, 69, 96, 0.2);
    border-top-color: #e94560;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-text {
    margin-top: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ── Status dot ── */
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e94560;
    border: 1.5px solid rgba(0,0,0,0.3);
    transition: background 0.3s;
    flex-shrink: 0;
  }
  .status-dot.connected { background: #4ade80; }
  .status-dot.connecting { background: #fbbf24; }
  /* In collapsed mode, position absolute in pet area */
  .container:not(.expanded) .status-dot {
    position: absolute;
    top: 32px;
    right: 12px;
  }
  /* In expanded mode, it lives in the top bar (flow layout) */
  .container.expanded .pet-area .status-dot { display: none; }
  .container:not(.expanded) .top-bar-dot { display: none; }

  /* ── Speech bubble ── */
  .speech-bubble {
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.93);
    border: 1.5px solid #e0dfe4;
    border-radius: 14px;
    padding: 4px 10px;
    font-size: 10px;
    color: #2d3436;
    max-width: 145px;
    text-align: center;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 100;
    white-space: normal;
    word-wrap: break-word;
    line-height: 1.3;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transform-origin: bottom center;
  }
  .speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(255, 255, 255, 0.93);
  }
  .speech-bubble.visible {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    animation: speech-pop 0.25s ease-out;
  }
  .speech-bubble.fading {
    opacity: 0;
    transform: translateX(-50%) scale(0.95);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  @keyframes speech-pop {
    0% { transform: translateX(-50%) scale(0.7); opacity: 0; }
    60% { transform: translateX(-50%) scale(1.05); }
    100% { transform: translateX(-50%) scale(1); opacity: 1; }
  }

  /* ── Status label (collapsed) ── */
  .status-label {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
    text-transform: capitalize;
  }
  .container:not(.expanded) .status-badge { display: none; }
  .container.expanded .status-label { display: none; }
  .expanded-status {
    text-align: center;
    flex-shrink: 0;
    padding: 2px 0 4px;
    display: none;
  }
  .container.expanded .expanded-status { display: block; }

  /* ── Expanded panel ── */
  .panel {
    display: none;
    flex-direction: column;
    flex: 1;
    padding: 4px 12px 12px;
    min-height: 0;
  }
  .container.expanded .panel { display: flex; }

  .output-area {
    flex: 1;
    background: #0d1117;
    border-radius: 10px;
    padding: 10px;
    overflow-y: auto;
    font-size: 12px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    line-height: 1.5;
    color: #c9d1d9;
    margin-bottom: 8px;
    min-height: 0;
    word-break: break-word;
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  .output-area * {
    -webkit-user-select: text;
    user-select: text;
  }
  .output-area .system-msg { color: #8b949e; font-style: italic; }
  .output-area .error-msg { color: #f85149; }
  .output-area .stream-text { color: #e6edf3; }
  .output-area .tool-msg { color: #d2a8ff; }

  /* ── Markdown rendered content ── */
  .md-rendered {
    font-family: 'Segoe UI', 'SF Pro', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.6;
    color: #e6edf3;
  }

  /* Headings */
  .md-heading {
    color: #e6edf3;
    font-weight: 700;
    margin: 10px 0 4px;
    line-height: 1.3;
  }
  .md-heading:first-child { margin-top: 0; }
  h1.md-heading { font-size: 17px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
  h2.md-heading { font-size: 15px; border-bottom: 1px solid #21262d; padding-bottom: 3px; }
  h3.md-heading { font-size: 14px; }
  h4.md-heading, h5.md-heading, h6.md-heading { font-size: 13px; }

  /* Fenced code blocks */
  .md-codeblock {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px 12px;
    margin: 6px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 11px;
    line-height: 1.5;
    color: #e6edf3;
    white-space: pre;
    word-break: normal;
    word-wrap: normal;
  }
  .md-codeblock code {
    background: none;
    padding: 0;
    border: none;
    font-size: inherit;
    color: inherit;
  }

  /* Inline code */
  .md-inline-code {
    background: #1b2332;
    border: 1px solid #30363d;
    border-radius: 4px;
    padding: 1px 5px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 11px;
    color: #f0883e;
    word-break: break-word;
  }

  /* Lists */
  .md-list {
    margin: 4px 0;
    padding-left: 20px;
  }
  .md-list li {
    margin: 2px 0;
    color: #c9d1d9;
  }

  /* Blockquotes */
  .md-quote {
    border-left: 3px solid #3b82f6;
    padding: 2px 10px;
    margin: 6px 0;
    color: #8b949e;
    background: rgba(56, 139, 253, 0.06);
    border-radius: 0 4px 4px 0;
  }

  /* Horizontal rule */
  .md-hr {
    border: none;
    border-top: 1px solid #21262d;
    margin: 8px 0;
  }

  /* Links */
  .md-rendered a {
    color: #58a6ff;
    text-decoration: none;
  }
  .md-rendered a:active {
    text-decoration: underline;
  }

  /* Strong, emphasis, strikethrough */
  .md-rendered strong { color: #e6edf3; font-weight: 700; }
  .md-rendered em { font-style: italic; }
  .md-rendered s { color: #8b949e; text-decoration: line-through; }

  /* Allow copy in rendered content */
  .md-rendered {
    -webkit-user-select: text;
    user-select: text;
  }

  /* Copy buttons */
  .copy-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid #30363d;
    border-radius: 5px;
    color: #8b949e;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .copy-btn:active { background: rgba(255, 255, 255, 0.15); }
  .copy-btn.copied { color: #4ade80; border-color: #4ade80; }

  .response-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 4px;
  }

  .md-codeblock-wrap {
    position: relative;
    margin: 6px 0;
  }
  .md-codeblock-wrap .code-copy-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid #30363d;
    border-radius: 4px;
    color: #8b949e;
    font-size: 10px;
    padding: 2px 6px;
    cursor: pointer;
    opacity: 0.6;
    z-index: 2;
  }
  .md-codeblock-wrap .code-copy-btn:active { opacity: 1; }
  .md-codeblock-wrap .code-copy-btn.copied { color: #4ade80; border-color: #4ade80; opacity: 1; }
  .md-codeblock-wrap .md-codeblock { margin: 0; }

  .input-row {
    display: flex;
    gap: 4px;
  }
  .input-row input {
    flex: 1;
    min-width: 0;
    background: #0d1117;
    border: 1.5px solid #30363d;
    border-radius: 8px;
    padding: 8px 8px;
    color: #e6edf3;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    -webkit-user-select: text;
    user-select: text;
  }
  .input-row input:focus { border-color: #e94560; }
  .input-row input::placeholder { color: #484f58; }

  .btn {
    background: #e94560;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn:active { opacity: 0.8; }
  .btn.cancel { background: #30363d; }
  .btn:disabled { opacity: 0.4; }

  /* ── Attach button ── */
  .attach-btn {
    background: #21213a;
    border: 1.5px solid #30363d;
    border-radius: 8px;
    color: #8b949e;
    font-size: 16px;
    padding: 6px 7px;
    cursor: pointer;
    flex-shrink: 0;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .attach-btn:active { border-color: #e94560; color: #e94560; }
  .attach-btn.has-file { border-color: #4ade80; color: #4ade80; }

  .attachment-preview {
    display: none;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
  }
  .attachment-preview.visible { display: flex; }
  .attachment-preview .thumb {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    object-fit: cover;
    border: 1px solid #30363d;
  }
  .attachment-preview .file-name {
    font-size: 11px;
    color: #8b949e;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .attachment-preview .remove-btn {
    background: none;
    border: none;
    color: #f85149;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .attachment-preview .file-size {
    font-size: 10px;
    color: #484f58;
    flex-shrink: 0;
  }

  .plan-toggle {
    background: #21213a;
    color: #8b949e;
    border: 1.5px solid #30363d;
    padding: 6px 7px;
    font-size: 11px;
    font-weight: 600;
  }
  .plan-toggle.active {
    background: #1a3a5c;
    color: #58a6ff;
    border-color: #58a6ff;
  }
  .plan-actions {
    display: flex;
    gap: 6px;
  }
  .plan-actions .btn.execute { background: #238636; flex: 1; }
  .plan-actions .btn.execute:active { background: #2ea043; }
  .plan-actions .btn.edit-plan { background: #1a3a5c; color: #58a6ff; border: 1.5px solid #58a6ff; }

  .status-badge {
    font-size: 10px;
    color: #0d1117;
    background: #4ade80;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: capitalize;
    font-weight: 600;
    display: inline-block;
  }

  /* ── Character selector button ── */
  .char-btn {
    background: #21213a;
    border: 1.5px solid #30363d;
    border-radius: 6px;
    color: #8b949e;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .char-btn:active { border-color: #e94560; color: #e94560; }
  .char-btn .char-icon { font-size: 13px; }

  /* ── Character picker overlay ── */
  .char-picker {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 25, 0.97);
    z-index: 200;
    flex-direction: column;
    border-radius: 16px;
    overflow: hidden;
  }
  .char-picker.visible { display: flex; }

  .char-picker-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 8px;
  }
  .char-picker-header .title {
    font-size: 14px;
    font-weight: 600;
    color: #e0e0e0;
  }
  .char-picker-header .close-btn {
    background: none;
    border: none;
    color: #8b949e;
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .char-picker-header .close-btn:active { color: #e94560; }

  .char-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .char-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #1a1a2e;
    border: 1.5px solid #30363d;
    border-radius: 10px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .char-item:active { background: #252545; }
  .char-item.selected {
    border-color: #e94560;
    background: #251525;
  }

  .char-item-preview {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background: #0d1117;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  .char-item-info {
    flex: 1;
    min-width: 0;
  }
  .char-item-name {
    font-size: 13px;
    font-weight: 600;
    color: #e0e0e0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .char-item-states {
    font-size: 10px;
    color: #8b949e;
    margin-top: 2px;
  }
  .char-item-check {
    color: #e94560;
    font-size: 16px;
    flex-shrink: 0;
  }

  .char-loading {
    text-align: center;
    color: #8b949e;
    font-size: 12px;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="container" id="container">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading character...</div>
  </div>

  <!-- Top bar (expanded only): char selector | dot + close -->
  <div class="top-bar">
    <button class="char-btn" id="charBtn"><span class="char-icon">&#x1F3AD;</span> <span id="charBtnLabel">Character</span></button>
    <div class="right-group">
      <div class="status-dot top-bar-dot" id="statusDotExpanded"></div>
      <button class="new-chat-btn" id="newChatBtn" title="New Chat">&#x2795;</button>
      <button class="close-btn" id="collapseBtn">&times;</button>
    </div>
  </div>

  <div class="pet-area" id="petArea">
    <div class="speech-bubble" id="speechBubble">
      <span class="speech-text" id="speechText"></span>
    </div>
    <canvas id="petCanvas" width="120" height="120"></canvas>
    <div class="status-dot" id="statusDot"></div>
  </div>
  <div class="status-label" id="statusLabel">idle</div>

  <!-- Status badge centered below pet (expanded only) -->
  <div class="expanded-status">
    <span class="status-badge" id="statusBadge">idle</span>
  </div>

  <div class="panel">
    <div class="output-area" id="output"></div>
    <div class="attachment-preview" id="attachPreview">
      <img class="thumb" id="attachThumb" src="" alt="">
      <span class="file-name" id="attachName"></span>
      <span class="file-size" id="attachSize"></span>
      <button class="remove-btn" id="removeAttach">&times;</button>
    </div>
    <div class="input-row" id="inputRow">
      <button class="attach-btn" id="attachBtn" title="Attach image">&#x1F4CE;</button>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/gif,image/webp" style="display:none">
      <input type="text" id="promptInput" placeholder="Ask Claude..." autocomplete="off" />
      <button class="btn plan-toggle" id="planToggle">Plan</button>
      <button class="btn" id="sendBtn">Send</button>
      <button class="btn cancel" id="cancelBtn" style="display:none">Stop</button>
    </div>
    <div class="plan-actions" id="planActions" style="display:none">
      <button class="btn execute" id="executeBtn" style="flex:1">Approve</button>
      <button class="btn edit-plan" id="editPlanBtn">Edit</button>
      <button class="btn cancel" id="discardBtn">Cancel</button>
    </div>
  </div>

  <!-- Character picker overlay -->
  <div class="char-picker" id="charPicker">
    <div class="char-picker-header">
      <span class="title">Choose Character</span>
      <button class="close-btn" id="charPickerClose">&times;</button>
    </div>
    <div class="char-list" id="charList">
      <div class="char-loading">Loading characters...</div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// Claude Code Pet — Mobile Client
// ══════════════════════════════════════════════════════════════════════════════

// ── URL params ──
const params = new URLSearchParams(location.search);
const TOKEN = params.get("token") || "";
const ORIGIN = location.origin;

// Character selection — URL param > Android bridge > localStorage > default
function getSavedChar() {
  // Try Android native SharedPreferences first
  if (window.AndroidBridge && window.AndroidBridge.getCharacter) {
    try { const c = window.AndroidBridge.getCharacter(); if (c) return c; } catch {}
  }
  // Fall back to localStorage (for browser testing)
  return localStorage.getItem("pet-character");
}
const STORED_CHAR = getSavedChar();
let activeCharId = params.get("char") || STORED_CHAR || "pixel-claude";

// ── DOM refs ──
const container = document.getElementById("container");
const petCanvas = document.getElementById("petCanvas");
const statusDot = document.getElementById("statusDot");
const statusLabel = document.getElementById("statusLabel");
const speechBubble = document.getElementById("speechBubble");
const speechText = document.getElementById("speechText");
const output = document.getElementById("output");
const promptInput = document.getElementById("promptInput");
const sendBtn = document.getElementById("sendBtn");
const cancelBtn = document.getElementById("cancelBtn");

// ══════════════════════════════════════════════════════════════════════════════
// SpriteRenderer (adapted from pet.html — uses HTTP URLs instead of file://)
// ══════════════════════════════════════════════════════════════════════════════

class SpriteRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.config = null;
    this.basePath = "";
    this.images = {};
    this.currentState = "idle";
    this.currentFrame = 0;
    this.frameTimer = null;
  }

  async loadCharacter(charId) {
    this.destroy();
    this.basePath = ORIGIN + "/characters/" + charId + "/";

    const configPath = this.basePath + "character.json";
    const raw = await fetch(configPath).then(r => r.text());
    this.config = JSON.parse(raw);

    if (!this.config.frameWidth) this.config.frameWidth = 120;
    if (!this.config.frameHeight) this.config.frameHeight = 120;
    if (!this.config.defaultFrameDuration) this.config.defaultFrameDuration = 150;
    if (!this.config.fallbackMap) this.config.fallbackMap = {};
    if (!this.config.states) this.config.states = {};

    const loadPromises = [];
    for (const [stateKey, stateConf] of Object.entries(this.config.states)) {
      loadPromises.push(this._loadImage(stateKey, stateConf.file));
    }
    await Promise.allSettled(loadPromises);
    this.setState("idle");
  }

  _loadImage(stateKey, filename) {
    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => { this.images[stateKey] = img; resolve(); };
      img.onerror = () => { resolve(); };
      img.src = this.basePath + filename;
    });
  }

  resolveState(key) {
    if (this.config.states[key] && this.images[key]) return key;
    const visited = new Set();
    let current = key;
    while (this.config.fallbackMap[current] && !visited.has(current)) {
      visited.add(current);
      current = this.config.fallbackMap[current];
      if (this.config.states[current] && this.images[current]) return current;
    }
    return this.images["idle"] ? "idle" : null;
  }

  setState(stateKey) {
    const resolved = this.resolveState(stateKey);
    if (!resolved) return;
    this.currentState = resolved;
    this.currentFrame = 0;
    if (this.frameTimer) { clearInterval(this.frameTimer); this.frameTimer = null; }

    const stateConf = this.config.states[resolved];
    const frameCount = stateConf.frameCount || 1;
    const duration = stateConf.frameDuration || this.config.defaultFrameDuration;
    const loop = true; // always loop on mobile — status persists longer

    this._drawFrame();

    if (frameCount > 1) {
      this.frameTimer = setInterval(() => {
        this.currentFrame++;
        if (this.currentFrame >= frameCount) {
          if (loop) {
            this.currentFrame = 0;
          } else {
            this.currentFrame = frameCount - 1;
            clearInterval(this.frameTimer);
            this.frameTimer = null;
            return;
          }
        }
        this._drawFrame();
      }, duration);
    }
  }

  _drawFrame() {
    const img = this.images[this.currentState];
    if (!img) return;
    const fw = this.config.frameWidth;
    const fh = this.config.frameHeight;
    this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.ctx.drawImage(img, this.currentFrame * fw, 0, fw, fh, 0, 0, this.canvas.width, this.canvas.height);
  }

  destroy() {
    if (this.frameTimer) { clearInterval(this.frameTimer); this.frameTimer = null; }
    if (this.ctx) this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    this.images = {};
    this.config = null;
    this.currentFrame = 0;
  }
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shorten(s, max) {
  if (!s) return "";
  return s.length > max ? s.substring(0, max - 1) + "\u2026" : s;
}
function speechBasename(filepath) {
  if (!filepath) return null;
  return filepath.replace(/\\/g, "/").split("/").pop();
}
function speechExtname(filepath) {
  const name = speechBasename(filepath);
  if (!name || !name.includes(".")) return null;
  return name.split(".").pop().toLowerCase();
}
function getHour() { return new Date().getHours(); }
function isLateNight() { const h = getHour(); return h >= 23 || h < 5; }
function isEarlyMorning() { const h = getHour(); return h >= 5 && h < 8; }
function isEvening() { const h = getHour(); return h >= 18 && h < 23; }

const SPEECH_DURATION = 3500;
const SPEECH_COOLDOWN = 5000;
const SPEECH_CHANCE = 0.70;
const RARE_CHANCE = 0.15;
const TIME_CHANCE = 0.12;
const STREAK_CHANCE = 0.50;
const IDLE_SPEECH_INTERVAL = 25000;
const IDLE_SPEECH_CHANCE = 0.30;

let speechTimer = null;
let speechCooldown = false;
let lastSpeechMessage = null;
let stateStreak = { state: null, count: 0 };
let idleSpeechTimer = null;

function generateSpeechMessage(status, context) {
  context = context || {};
  const pool = SPEECH[status];
  if (!pool) return null;

  if (status === stateStreak.state) {
    stateStreak.count++;
  } else {
    stateStreak = { state: status, count: 1 };
  }

  const streaks = STREAK_MESSAGES[status];
  if (streaks && Math.random() < STREAK_CHANCE) {
    const thresholds = Object.keys(streaks).map(Number).sort((a, b) => b - a);
    for (const t of thresholds) {
      if (stateStreak.count >= t) return pick(streaks[t]);
    }
  }

  if (Math.random() < TIME_CHANCE) {
    if (isLateNight()) return pick(TIME_MESSAGES.lateNight);
    if (isEarlyMorning()) return pick(TIME_MESSAGES.earlyMorning);
    if (isEvening()) return pick(TIME_MESSAGES.evening);
  }

  if (pool.rare && Math.random() < RARE_CHANCE) return pick(pool.rare);

  if (context.error && pool.withError) {
    const msgs = pool.withError(context.error);
    if (msgs) return typeof msgs === "string" ? msgs : pick(msgs);
  }
  if (context.command && pool.withCommand) {
    const msgs = pool.withCommand(context.command);
    if (msgs) return typeof msgs === "string" ? msgs : pick(msgs);
  }
  if (context.file && pool.withFile) {
    const msgs = pool.withFile(context.file);
    if (msgs) return typeof msgs === "string" ? msgs : pick(msgs);
  }
  if (context.query && pool.withQuery) {
    const msgs = pool.withQuery(context.query);
    if (msgs) return typeof msgs === "string" ? msgs : pick(msgs);
  }

  return pick(pool.generic);
}

function showSpeechBubble(message) {
  if (!message) return;
  if (speechCooldown) return;
  if (Math.random() > SPEECH_CHANCE) return;
  if (message === lastSpeechMessage) return;

  lastSpeechMessage = message;
  if (speechTimer) clearTimeout(speechTimer);

  speechText.textContent = message;
  speechBubble.classList.remove("fading");
  speechBubble.classList.add("visible");

  speechTimer = setTimeout(() => {
    speechBubble.classList.add("fading");
    setTimeout(() => speechBubble.classList.remove("visible", "fading"), 500);
  }, SPEECH_DURATION);

  speechCooldown = true;
  setTimeout(() => { speechCooldown = false; }, SPEECH_COOLDOWN);
}

function showSpeechForced(message) {
  if (!message) return;
  lastSpeechMessage = message;
  if (speechTimer) clearTimeout(speechTimer);
  speechText.textContent = message;
  speechBubble.classList.remove("fading");
  speechBubble.classList.add("visible");
  speechTimer = setTimeout(() => {
    speechBubble.classList.add("fading");
    setTimeout(() => speechBubble.classList.remove("visible", "fading"), 500);
  }, SPEECH_DURATION + 1000);
}

function startIdleSpeech() {
  stopIdleSpeech();
  idleSpeechTimer = setInterval(() => {
    if (currentStatus === "idle" && Math.random() < IDLE_SPEECH_CHANCE) {
      const msg = generateSpeechMessage("idle", {});
      if (msg && msg !== lastSpeechMessage) {
        lastSpeechMessage = msg;
        if (speechTimer) clearTimeout(speechTimer);
        speechText.textContent = msg;
        speechBubble.classList.remove("fading");
        speechBubble.classList.add("visible");
        speechTimer = setTimeout(() => {
          speechBubble.classList.add("fading");
          setTimeout(() => speechBubble.classList.remove("visible", "fading"), 500);
        }, SPEECH_DURATION);
      }
    }
  }, IDLE_SPEECH_INTERVAL);
}

function stopIdleSpeech() {
  if (idleSpeechTimer) { clearInterval(idleSpeechTimer); idleSpeechTimer = null; }
}

// ══════════════════════════════════════════════════════════════════════════════
// Relay Client (WebSocket)
// ══════════════════════════════════════════════════════════════════════════════

class RelayClient {
  constructor() {
    this.ws = null;
    this.connected = false;
    this.reconnectDelay = 1000;
    this.maxReconnectDelay = 30000;
    this.pingInterval = null;
  }

  connect() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${protocol}//${location.host}`;

    this.ws = new WebSocket(wsUrl);
    setDotClass("status-dot connecting");

    this.ws.onopen = () => {
      this.ws.send(JSON.stringify({ type: "auth", token: TOKEN }));
    };

    this.ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      this._handleMessage(msg);
    };

    this.ws.onclose = () => {
      this.connected = false;
      setDotClass("status-dot");
      this._stopPing();
      setTimeout(() => {
        this.reconnectDelay = Math.min(this.reconnectDelay * 1.5, this.maxReconnectDelay);
        this.connect();
      }, this.reconnectDelay);
    };

    this.ws.onerror = () => {
      // onclose will fire after this
    };
  }

  _handleMessage(msg) {
    switch (msg.type) {
      case "auth_ok":
        this.connected = true;
        this.reconnectDelay = 1000;
        setDotClass("status-dot connected");
        this._startPing();
        appendOutput("Connected to relay", "system-msg");
        break;

      case "auth_fail":
        appendOutput("Authentication failed — check token", "error-msg");
        break;

      case "pet_status":
        handlePetStatus(msg.status, msg.context || {});
        break;

      case "task_start":
        isRunning = true;
        updateButtons();
        if (msg.phase === "plan") appendOutput(`Planning: ${msg.prompt}`, "system-msg");
        else if (msg.phase === "execute") appendOutput("Executing plan...", "system-msg");
        else appendOutput(`\u25B6 Running: ${msg.prompt}`, "system-msg");
        break;

      case "stream":
        appendStream(msg.text);
        break;

      case "output":
        appendOutput(msg.text, "stream-text");
        break;

      case "tool_event":
        if (msg.tool && msg.status === "tool_use") {
          // Show tool with detail: "Read → main.js", "Edit → OverlayService.kt"
          const toolLabel = msg.detail ? `${msg.tool} \u2192 ${msg.detail.replace(/\\/g, "/").split("/").pop()}` : msg.tool;
          appendOutput(`\u{1F527} ${toolLabel}`, "tool-msg");
        }
        break;

      case "task_done": {
        isRunning = false;
        const dur = msg.duration ? ` (${Math.round(msg.duration / 1000)}s)` : "";
        if (msg.phase === "plan") {
          appendOutput("Plan ready \u2014 review above, then execute or discard" + dur, "system-msg");
          updateButtons("plan_ready");
        } else if (msg.phase === "execute") {
          appendOutput("Plan executed!" + dur, "system-msg");
          updateButtons();
        } else {
          appendOutput(`\u2705 Done${dur}`, "system-msg");
          updateButtons();
        }
        break;
      }

      case "task_cancelled":
        isRunning = false;
        updateButtons();
        appendOutput("\u274C Cancelled", "system-msg");
        break;

      case "queued":
        appendOutput(`Queued (#${msg.position}): ${msg.prompt}`, "system-msg");
        break;

      case "error":
        appendOutput(`Error: ${msg.message}`, "error-msg");
        break;

      case "log":
        appendOutput(msg.text, "system-msg");
        break;

      case "info":
        appendOutput(msg.message, "system-msg");
        break;

      case "pong":
        break;
    }
  }

  send(msg) {
    if (this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify(msg));
    }
  }

  _startPing() {
    this._stopPing();
    this.pingInterval = setInterval(() => {
      this.send({ type: "ping" });
    }, 25000);
  }

  _stopPing() {
    if (this.pingInterval) { clearInterval(this.pingInterval); this.pingInterval = null; }
  }
}

// Markdown Rendering (escape-first for XSS safety)
// ══════════════════════════════════════════════════════════════════════════════

function escapeHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function parseMarkdown(escaped) {
  // Phase 1: Extract fenced code blocks to protect their content
  const codeBlocks = [];
  let text = escaped.replace(/^```(\w*)\n([\s\S]*?)^```\s*$/gm, (m, lang, code) => {
    const idx = codeBlocks.length;
    codeBlocks.push({ lang, code });
    return "\x00CB" + idx + "\x00";
  });

  // Phase 2: Block-level transforms (line-based)
  const lines = text.split("\n");
  const out = [];
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    // Check for placeholder (code block) — pass through
    if (line.match(/^\x00CB\d+\x00$/)) {
      out.push(line);
      i++;
      continue;
    }

    // Headings
    const headingMatch = line.match(/^(#{1,6})\s+(.+)$/);
    if (headingMatch) {
      const lvl = headingMatch[1].length;
      out.push(`<h${lvl} class="md-heading">${headingMatch[2]}</h${lvl}>`);
      i++;
      continue;
    }

    // Horizontal rules
    if (/^(---+|\*\*\*+|___+)\s*$/.test(line)) {
      out.push('<hr class="md-hr">');
      i++;
      continue;
    }

    // Blockquotes (> is escaped to &gt;)
    if (/^&gt;\s?/.test(line)) {
      const quoteLines = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) {
        quoteLines.push(lines[i].replace(/^&gt;\s?/, ""));
        i++;
      }
      out.push('<div class="md-quote">' + quoteLines.join("<br>") + "</div>");
      continue;
    }

    // Unordered lists
    if (/^[\-\*\+]\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^[\-\*\+]\s+/.test(lines[i])) {
        items.push("<li>" + lines[i].replace(/^[\-\*\+]\s+/, "") + "</li>");
        i++;
      }
      out.push('<ul class="md-list">' + items.join("") + "</ul>");
      continue;
    }

    // Ordered lists
    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
        items.push("<li>" + lines[i].replace(/^\d+\.\s+/, "") + "</li>");
        i++;
      }
      out.push('<ol class="md-list">' + items.join("") + "</ol>");
      continue;
    }

    // Regular line
    out.push(line);
    i++;
  }

  text = out.join("\n");

  // Phase 3: Inline transforms
  text = text.replace(/`([^`]+?)`/g, '<code class="md-inline-code">$1</code>');
  text = text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/__(.+?)__/g, "<strong>$1</strong>");
  text = text.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, "<em>$1</em>");
  text = text.replace(/~~(.+?)~~/g, "<s>$1</s>");
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, url) => {
    const href = url.replace(/&amp;/g, "&");
    return '<a href="' + href + '" target="_blank" rel="noopener">' + label + "</a>";
  });

  // Line breaks: double newline → paragraph break, single → <br>
  text = text.replace(/\n{2,}/g, "<br><br>");
  text = text.replace(/\n/g, "<br>");

  // Phase 4: Restore code blocks (wrapped with copy button)
  text = text.replace(/\x00CB(\d+)\x00/g, (m, idx) => {
    const block = codeBlocks[parseInt(idx)];
    const langCls = block.lang ? ' class="language-' + block.lang + '"' : "";
    const langLabel = block.lang ? block.lang : "";
    return '<div class="md-codeblock-wrap"><button class="code-copy-btn" onclick="copyCode(this)">' +
      (langLabel ? langLabel + ' \u00B7 ' : '') + 'Copy</button>' +
      '<pre class="md-codeblock"><code' + langCls + ">" + block.code + "</code></pre></div>";
  });

  return text;
}

function copyToClipboard(text, btn) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showCopied(btn)).catch(() => fallbackCopy(text, btn));
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;left:-9999px;top:-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); showCopied(btn); } catch {}
  document.body.removeChild(ta);
}

function showCopied(btn) {
  if (!btn) return;
  const orig = btn.textContent;
  btn.textContent = "\u2713 Copied";
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = orig; btn.classList.remove("copied"); }, 1500);
}

function copyCode(btn) {
  const wrap = btn.closest(".md-codeblock-wrap");
  const code = wrap ? wrap.querySelector("code") : null;
  if (code) copyToClipboard(code.textContent, btn);
}

function copyResponse(btn) {
  const container = btn.closest(".stream-text");
  if (container) {
    // Get text content but skip the copy buttons themselves
    const clone = container.cloneNode(true);
    clone.querySelectorAll(".copy-btn, .code-copy-btn").forEach(b => b.remove());
    copyToClipboard(clone.textContent, btn);
  }
}

// ── Streaming text accumulator ──
let streamEl = null;
let streamBuffer = "";
let renderTimer = null;
const RENDER_DEBOUNCE = 80;

function renderStream() {
  if (streamEl && streamBuffer) {
    streamEl.innerHTML = parseMarkdown(escapeHtml(streamBuffer));
    // Add copy button if not already present
    if (!streamEl.querySelector(".response-header")) {
      const hdr = document.createElement("div");
      hdr.className = "response-header";
      hdr.innerHTML = '<button class="copy-btn" onclick="copyResponse(this)">\u2398 Copy</button>';
      streamEl.insertBefore(hdr, streamEl.firstChild);
    }
    requestAnimationFrame(() => {
      output.scrollTop = output.scrollHeight;
    });
  }
}

function appendStream(text) {
  streamBuffer += text;
  if (!streamEl) {
    streamEl = document.createElement("div");
    streamEl.className = "stream-text md-rendered";
    output.appendChild(streamEl);
  }
  if (renderTimer) clearTimeout(renderTimer);
  renderTimer = setTimeout(renderStream, RENDER_DEBOUNCE);
}

function appendOutput(text, cls) {
  // Finalize any in-progress stream
  if (streamEl && streamBuffer) {
    if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
    renderStream();
  }
  streamEl = null;
  streamBuffer = "";
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }

  const div = document.createElement("div");
  div.className = cls || "";
  if (cls === "stream-text") {
    div.classList.add("md-rendered");
    div.innerHTML = '<div class="response-header"><button class="copy-btn" onclick="copyResponse(this)">\u2398 Copy</button></div>' +
      parseMarkdown(escapeHtml(text));
  } else {
    div.textContent = text;
  }
  output.appendChild(div);
  // Keep output manageable
  while (output.children.length > 200) output.removeChild(output.firstChild);
  output.scrollTop = output.scrollHeight;
}

// Pet status handling
// ══════════════════════════════════════════════════════════════════════════════

let idleRevertTimer = null;

// ── Variant system (mirrors desktop pet.html) ──
const IDLE_VARIANTS = [
  "idle", "idle-2", "idle-3", "idle-4", "idle-5", "idle-6", "idle-7", "idle-8",
  "idle-vibing", "idle-sleepy", "idle-coffee", "idle-coffee-2", "idle-stargazing",
];
const RARE_IDLE_VARIANTS = [
  { key: "idle-stretching", chance: 0.08 },
  { key: "idle-dancing",    chance: 0.08 },
  { key: "idle-butterfly",  chance: 0.05 },
  { key: "idle-juggling",   chance: 0.05 },
  { key: "idle-rainbow",    chance: 0.02 },
  { key: "idle-meditation", chance: 0.02 },
];
const ACTIVITY_RARE_VARIANTS = {
  coding:    [{ key: "coding-flow", chance: 0.12 }, { key: "coding-hacking", chance: 0.04 }],
  thinking:  [{ key: "thinking-eureka", chance: 0.12 }, { key: "thinking-galaxy", chance: 0.04 }],
  debugging: [{ key: "debugging-detective", chance: 0.12 }, { key: "debugging-rage", chance: 0.04 }],
  searching: [{ key: "searching-treasure", chance: 0.12 }, { key: "searching-deep", chance: 0.04 }],
  reading:   [{ key: "reading-scholar", chance: 0.12 }, { key: "reading-ancient", chance: 0.04 }],
  testing:   [{ key: "testing-scientist", chance: 0.12 }, { key: "testing-perfectionist", chance: 0.04 }],
  deploying: [{ key: "deploying-warp", chance: 0.12 }, { key: "deploying-satellite", chance: 0.04 }],
};
const THINKING_THEMES = [
  "thinking-cooking", "thinking-action", "thinking-creating",
  "thinking-processing", "thinking-growing", "thinking-magical",
  "thinking-silly", "thinking-exploring",
];

let currentBaseState = null;
let currentActivityVariant = null;
let idleCycleTimer = null;
let idleCycleIndex = 0;

function hasState(key) {
  return sprite && sprite.config && sprite.config.states && sprite.config.states[key] && sprite.images[key];
}

function startIdleCycle() {
  stopIdleCycle();
  idleCycleIndex = Math.floor(Math.random() * IDLE_VARIANTS.length);
  applyIdleVariant();
  idleCycleTimer = setInterval(() => {
    idleCycleIndex = (idleCycleIndex + 1) % IDLE_VARIANTS.length;
    applyIdleVariant();
  }, 12000);
}

function stopIdleCycle() {
  if (idleCycleTimer) { clearInterval(idleCycleTimer); idleCycleTimer = null; }
}

function applyIdleVariant() {
  // Roll for rare idle variant
  const roll = Math.random();
  let cumulative = 0;
  for (const rv of RARE_IDLE_VARIANTS) {
    cumulative += rv.chance;
    if (roll < cumulative && hasState(rv.key)) {
      sprite.setState(rv.key);
      return;
    }
  }
  // Normal cycle
  const variant = IDLE_VARIANTS[idleCycleIndex];
  if (hasState(variant)) sprite.setState(variant);
  else sprite.setState("idle");
}

function rollActivityVariant(baseState) {
  // Don't re-roll if same base state persists
  if (baseState === currentBaseState && currentActivityVariant) return currentActivityVariant;
  currentBaseState = baseState;
  currentActivityVariant = null;

  const variants = ACTIVITY_RARE_VARIANTS[baseState];
  if (variants) {
    const roll = Math.random();
    let cumulative = 0;
    for (const rv of variants) {
      cumulative += rv.chance;
      if (roll < cumulative && hasState(rv.key)) {
        currentActivityVariant = rv.key;
        return rv.key;
      }
    }
  }
  // For thinking: pick a random theme if no rare hit
  if (baseState === "thinking") {
    const theme = THINKING_THEMES[Math.floor(Math.random() * THINKING_THEMES.length)];
    if (hasState(theme)) {
      currentActivityVariant = theme;
      return theme;
    }
  }
  return baseState;
}

function handlePetStatus(status, context) {
  if (!status) return;
  const prevStatus = currentStatus;
  currentStatus = status;
  statusLabel.textContent = status;
  statusBadge.textContent = status;
  // Color the badge by state
  const badgeColors = { idle: "#4ade80", coding: "#60a5fa", thinking: "#fbbf24",
    success: "#4ade80", error: "#f85149", searching: "#c084fc", reading: "#67e8f9",
    debugging: "#fb923c", installing: "#a78bfa", testing: "#34d399", deploying: "#f472b6" };
  statusBadge.style.background = badgeColors[status] || "#8b949e";

  if (sprite && sprite.config) {
    if (status === "idle") {
      stopIdleCycle();
      startIdleCycle();
    } else {
      stopIdleCycle();
      currentBaseState = null;
      currentActivityVariant = null;
      const variant = rollActivityVariant(status);
      sprite.setState(variant);
    }
  }

  // Auto-revert transient states to idle (in case desktop app isn't running)
  if (idleRevertTimer) { clearTimeout(idleRevertTimer); idleRevertTimer = null; }
  const quickRevert = ["success", "error"];
  const slowRevert = ["thinking", "coding", "searching", "reading", "debugging",
    "installing", "testing", "deploying", "cooking", "hatching", "deleting", "downloading"];
  if (quickRevert.includes(status)) {
    idleRevertTimer = setTimeout(() => handlePetStatus("idle", {}), 6000);
  } else if (slowRevert.includes(status)) {
    idleRevertTimer = setTimeout(() => handlePetStatus("idle", {}), 120000);
  }

  if (status !== prevStatus) {
    const msg = generateSpeechMessage(status, context);
    showSpeechBubble(msg);

    if (status === "idle") startIdleSpeech();
    else stopIdleSpeech();
  }
}

// Prompt sending
// ══════════════════════════════════════════════════════════════════════════════

function updateButtons(phase) {
  if (phase === "plan_ready") {
    inputRow.style.display = "none";
    planActions.style.display = "flex";
  } else if (isRunning) {
    inputRow.style.display = "flex";
    planActions.style.display = "none";
    sendBtn.style.display = "none";
    cancelBtn.style.display = "";
  } else {
    inputRow.style.display = "flex";
    planActions.style.display = "none";
    sendBtn.style.display = "";
    cancelBtn.style.display = "none";
  }
}

function sendPrompt() {
  const text = promptInput.value.trim();
  if (!text && !pendingAttachment) return;
  const msg = { type: "prompt", prompt: text || "(see attached image)" };
  if (editingPlan) {
    msg.planMode = true;
    editingPlan = false;
    promptInput.placeholder = "Ask Claude...";
  } else {
    msg.planMode = planModeEnabled;
  }
  if (pendingAttachment) {
    msg.attachments = [{
      name: pendingAttachment.name,
      mimeType: pendingAttachment.mimeType,
      data: pendingAttachment.data,
    }];
    clearAttachment();
  }
  relay.send(msg);
  promptInput.value = "";
}

// ── Attachment handling ──
attachBtn.addEventListener("click", () => {
  if (typeof AndroidBridge !== "undefined" && AndroidBridge.openFilePicker) {
    // Android overlay: native file picker bypasses WebView user gesture issues
    AndroidBridge.openFilePicker();
  } else {
    fileInput.click();
  }
});

// Called by Android native code after user picks a file
window._onAndroidFilePicked = function(name, mimeType, base64Data, size) {
  pendingAttachment = {
    name: name,
    mimeType: mimeType,
    data: base64Data,
    size: size,
  };
  attachThumb.src = "data:" + mimeType + ";base64," + base64Data;
  attachName.textContent = name;
  attachSize.textContent = formatSize(size);
  attachPreview.classList.add("visible");
  attachBtn.classList.add("has-file");
};

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;
  const validTypes = ["image/png", "image/jpeg", "image/gif", "image/webp"];
  if (!validTypes.includes(file.type)) {
    appendOutput("Unsupported file type. Use PNG, JPEG, GIF, or WebP.", "error-msg");
    fileInput.value = "";
    return;
  }
  if (file.size > MAX_FILE_SIZE) {
    appendOutput("File too large (max 10MB).", "error-msg");
    fileInput.value = "";
    return;
  }
  const reader = new FileReader();
  reader.onload = (e) => {
    const dataUrl = e.target.result;
    pendingAttachment = {
      name: file.name,
      mimeType: file.type,
      data: dataUrl.split(",")[1],
      size: file.size,
    };
    attachThumb.src = dataUrl;
    attachName.textContent = file.name;
    attachSize.textContent = formatSize(file.size);
    attachPreview.classList.add("visible");
    attachBtn.classList.add("has-file");
  };
  reader.readAsDataURL(file);
  fileInput.value = "";
});

removeAttach.addEventListener("click", clearAttachment);

function clearAttachment() {
  pendingAttachment = null;
  attachPreview.classList.remove("visible");
  attachBtn.classList.remove("has-file");
  attachThumb.src = "";
  attachName.textContent = "";
  attachSize.textContent = "";
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

sendBtn.addEventListener("click", sendPrompt);
promptInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); sendPrompt(); }
});
cancelBtn.addEventListener("click", () => {
  relay.send({ type: "cancel" });
});

// Tell Android to move overlay up when keyboard appears
promptInput.addEventListener("focus", () => {
  container.classList.add("keyboard-mode");
  if (window.AndroidBridge && window.AndroidBridge.setKeyboardVisible) {
    try { window.AndroidBridge.setKeyboardVisible(true); } catch {}
  }
});
promptInput.addEventListener("blur", () => {
  container.classList.remove("keyboard-mode");
  if (window.AndroidBridge && window.AndroidBridge.setKeyboardVisible) {
    try { window.AndroidBridge.setKeyboardVisible(false); } catch {}
  }
});

// ══════════════════════════════════════════════════════════════════════════════
// Character Picker
// ══════════════════════════════════════════════════════════════════════════════

let charListData = []; // cached list from server

async function fetchCharacters() {
  try {
    const res = await fetch(ORIGIN + "/characters");
    charListData = await res.json();
  } catch {
    charListData = [];
  }
  return charListData;
}

function renderCharPicker() {
  charList.innerHTML = "";
  if (charListData.length === 0) {
    charList.innerHTML = '<div class="char-loading">No characters found</div>';
    return;
  }

  for (const char of charListData) {
    const item = document.createElement("div");
    item.className = "char-item" + (char.id === activeCharId ? " selected" : "");

    const preview = document.createElement("canvas");
    preview.className = "char-item-preview";
    preview.width = 120;
    preview.height = 120;
    // Load a preview frame from the character's idle sprite
    loadCharPreview(preview, char.id);

    const info = document.createElement("div");
    info.className = "char-item-info";
    const name = document.createElement("div");
    name.className = "char-item-name";
    name.textContent = char.name || char.id;
    info.appendChild(name);

    // Load state count
    fetchCharStateCount(char.id).then(count => {
      const states = document.createElement("div");
      states.className = "char-item-states";
      states.textContent = `${count} animation${count !== 1 ? "s" : ""}`;
      info.appendChild(states);
    });

    const check = document.createElement("div");
    check.className = "char-item-check";
    check.textContent = char.id === activeCharId ? "\u2713" : "";

    item.appendChild(preview);
    item.appendChild(info);
    item.appendChild(check);

    item.addEventListener("click", () => selectCharacter(char.id));
    charList.appendChild(item);
  }
}

async function loadCharPreview(canvas, charId) {
  try {
    const configUrl = ORIGIN + "/characters/" + charId + "/character.json";
    const config = await fetch(configUrl).then(r => r.json());
    const idleState = config.states && config.states.idle;
    if (!idleState) return;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const fw = config.frameWidth || 120;
      const fh = config.frameHeight || 120;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, 120, 120);
      ctx.drawImage(img, 0, 0, fw, fh, 0, 0, 120, 120);
    };
    img.src = ORIGIN + "/characters/" + charId + "/" + idleState.file;
  } catch {}
}

async function fetchCharStateCount(charId) {
  try {
    const configUrl = ORIGIN + "/characters/" + charId + "/character.json";
    const config = await fetch(configUrl).then(r => r.json());
    return config.states ? Object.keys(config.states).length : 0;
  } catch {
    return 0;
  }
}

async function selectCharacter(charId) {
  if (charId === activeCharId) {
    closeCharPicker();
    return;
  }

  activeCharId = charId;
  localStorage.setItem("pet-character", charId);
  // Save to Android SharedPreferences (persists across overlay restarts)
  if (window.AndroidBridge && window.AndroidBridge.setCharacter) {
    try { window.AndroidBridge.setCharacter(charId); } catch {}
  }
  charBtnLabel.textContent = charListData.find(c => c.id === charId)?.name || charId;

  // Reload sprite with loading indicator
  loadingOverlay.classList.remove("hidden");
  try {
    await sprite.loadCharacter(charId);
    sprite.setState(currentStatus);
    appendOutput(`Switched to: ${charId}`, "system-msg");
  } catch (e) {
    appendOutput(`Failed to load ${charId}: ${e.message}`, "error-msg");
  }
  loadingOverlay.classList.add("hidden");

  closeCharPicker();
}

function openCharPicker() {
  charPicker.classList.add("visible");
  // Refresh list
  fetchCharacters().then(() => renderCharPicker());
}

function closeCharPicker() {
  charPicker.classList.remove("visible");
}

charBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  openCharPicker();
});

charPickerClose.addEventListener("click", (e) => {
  e.stopPropagation();
  closeCharPicker();
});

// Init
// ══════════════════════════════════════════════════════════════════════════════

const sprite = new SpriteRenderer(petCanvas);
const relay = new RelayClient();

async function init() {
  // Load character list for the picker button label
  await fetchCharacters();
  const charInfo = charListData.find(c => c.id === activeCharId);
  charBtnLabel.textContent = charInfo ? charInfo.name : activeCharId;

  try {
    await sprite.loadCharacter(activeCharId);
    appendOutput(`Loaded: ${charInfo ? charInfo.name : activeCharId}`, "system-msg");
  } catch (e) {
    appendOutput(`Failed to load character: ${e.message}`, "error-msg");
  }
  loadingOverlay.classList.add("hidden");

  if (TOKEN) {
    relay.connect();
  } else {
    appendOutput("No token provided — add ?token=xxx to URL", "error-msg");
    setDotClass("status-dot");
  }

  startIdleSpeech();
}

init();
</script>
</body>
</html>
